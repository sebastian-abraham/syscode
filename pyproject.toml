[project]
name = "syscode"
version = "0.1.0"
description = "Map a project folder into a four-level graph and view it in the browser."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "pathspec",
    "httpx",
]

[project.scripts]
syscode = "syscode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["syscode"]
