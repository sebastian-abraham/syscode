[package]
name = "syscode-desktop"
version = "0.1.0"
description = "SysCode desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux only: needed to reach the platform WebKitGTK WebView (via Tauri's
# `with_webview`) and turn off the WebKit "PreferPageRenderingUpdatesNear60FPS"
# feature so page rendering is not clamped to ~60fps on high-refresh displays.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[features]
default = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
