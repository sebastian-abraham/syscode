<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Demo Webapp</title>
  </head>
  <body>
    <h1>Demo Webapp</h1>

    <section>
      <h2>Weather</h2>
      <button id="weather-button" type="button">Get weather</button>
      <pre id="weather-output"></pre>
    </section>

    <section>
      <h2>Notes</h2>
      <form id="note-form">
        <input id="note-input" name="text" type="text" placeholder="Write a note" required />
        <button type="submit">Add note</button>
      </form>
      <ul id="notes-list"></ul>
    </section>

    <script src="app.js"></script>
  </body>
</html>
